      '<div class="seclabel" id="sec-bp-teaching">What the dial teaches</div><ol class="teach">' + bp.dialTeaching.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" +
      '<div class="seclabel" id="sec-bp-surfaces">Where the work belongs: chat and agent surfaces</div><p class="prose">' + esc(bp.surfacesIntro) + '</p><div class="tablewrap" style="margin-top:12px"><table class="plain"><thead><tr><th>Provider</th><th>Chat</th><th>Agent surface (files, schedules)</th><th>What to know</th></tr></thead><tbody>' +
      bp.surfaces.map(function (r) { return '<tr><td class="k">' + esc(r.provider) + "</td><td>" + esc(r.chat) + "</td><td>" + esc(r.agent) + "</td><td>" + esc(r.note) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<div class="seclabel" id="sec-bp-tiers">Reading the three tiers</div><div class="tiles">' +
      TIERS.map(function (t, i) { return '<div class="tile ' + t + '"><div class="t">' + esc(DATA.tiers[t].label) + '</div><div class="w">' + esc(DATA.tiers[t].weighting) + "</div>" + esc(bp.readingTiers[i]) + "</div>"; }).join("") + "</div>" +
      '<ul class="rules" style="margin-top:12px">' + bp.readingTiers.slice(3).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" +
      '<div class="seclabel" id="sec-bp-prompting">Prompting fundamentals</div><ol class="teach">' + bp.promptingPrinciples.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" +
      '<div class="seclabel" id="sec-bp-tips">Tips, limitations and nuances by family</div>' +
      bp.nuances.map(function (n) { return '<div class="nuance" id="tips-' + slug(n.family) + '"><div class="f">' + esc(n.family) + "</div><ul>" + n.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>"; }).join("") +
      '<div class="seclabel" id="sec-bp-architecture">Architecture in plain English</div>' +
      bp.architecture.map(function (a) { return '<div class="arch"><div class="t">' + esc(a.term) + "</div><p>" + esc(a.text) + "</p></div>"; }).join("");
    q("#page-best-practices").innerHTML = html;
  }

  /* ---------- workflows ---------- */
  /* One card per router row. A step's app links to its surface card and its model to its model card, so the chain,
     the surface and the model stay one click apart. Numbered nodes are the sequence: filled in the vendor's color when
     an app does the step, hollow when you do. */
  var SURF = {};
  function surfaceIndex() {
    if (SURF._built) return SURF;
    PROV_PAGES.forEach(function (pid) { DATA.providers[pid].surfaceCards.forEach(function (s) { SURF[s.name] = pid; }); });
    SURF._built = true;
    return SURF;
  }
  function stepProvider(s) { return s.kind === "you" ? "you" : (surfaceIndex()[s.surface] || "other"); }
  function wfStep(s, i, w) {
    var n = i + 1;
    if (s.kind === "you") {
      return '<li class="wstep you"><span class="wnode" aria-hidden="true">' + n + '</span><div class="wbody">' +
        '<div class="wtop"><span class="wt">' + esc(s.title) + '</span><span class="wwho">You</span></div>' +
        '<p class="wyou">' + esc(s.text) + "</p></div></li>";
    }
    var pid = stepProvider(s);
    var m = s.model ? model(s.model) : null;
    var html = '<li class="wstep" style="--pc:' + (DATA.providerColors[pid] || DATA.providerColors.other) + '"><span class="wnode" aria-hidden="true">' + n + '</span><div class="wbody">' +
      '<div class="wtop"><span class="wt">' + esc(s.title) + "</span></div>" +
      '<div class="wapp"><button type="button" class="wchip" data-jump="' + pid + "/surface-" + esc(slug(s.surface)) + '" title="Open the ' + esc(s.surface) + ' surface card">' + esc(s.app) + "</button>" +
      (m ? '<button type="button" class="wmodel" data-card="' + m.id + '" title="Open the ' + esc(m.name) + ' card">' + esc(m.name) + "</button>" : '<span class="wmodel none">' + esc(s.modelLabel) + "</span>") +
      '<span class="wset">' + esc(s.setting) + "</span></div>" +
      '<div class="wio"><div><span class="k">In</span>' + esc(s.input) + '</div><div><span class="k">Out</span>' + esc(s.output) + "</div></div>" +
      (s.note ? '<p class="wnote">' + esc(s.note) + "</p>" : "");
    if (w.full && s.prompt) {
      html += '<details class="fold wkit" id="wf-' + w.row + "-step-" + n + '"><summary>Prompt, hand-on and check</summary><div class="pbody">' +
        '<div class="wprompt"><div class="wphead"><span class="psub">Prompt</span><button type="button" class="wcopy" data-copy="wf-' + w.row + "-prompt-" + n + '">Copy prompt</button></div>' +
        '<pre class="tpl" id="wf-' + w.row + "-prompt-" + n + '">' + esc(s.prompt) + "</pre></div>" +
        '<div class="psub">Hand on</div><p>' + esc(s.handoff) + "</p>" +
        '<div class="psub">Check before the next step</div><p>' + esc(s.check) + "</p></div></details>";
    }
    return html + "</div></li>";
  }
  function wfDots(w) {
    return w.steps.map(function (s) { var p = stepProvider(s); return '<span class="wdot ' + p + '" title="' + esc(s.kind === "you" ? "You" : s.app) + '"></span>'; }).join("");
  }
  function wfCard(w) {
    var uc = useCase(w.row);
    var g = DATA.groups.filter(function (x) { return x.key === uc.group; })[0];
    return '<article class="wcard" id="wf-' + w.row + '">' +
      '<header class="whead"><div class="wmetaline"><span class="wrow">Row ' + w.row + "</span>" + (g ? '<span class="wgroup">' + esc(g.label) + "</span>" : "") +
        (w.full ? '<span class="pill wkitpill">Full kit</span>' : '<span class="pill tier">Step map</span>') + "</div>" +
        "<h3>" + esc(uc.name) + '</h3><p class="wchain">' + esc(w.chain) + "</p></header>" +
      '<p class="woutcome">' + esc(w.outcome) + "</p>" +
      '<div class="wmeta"><div><span class="k">When</span>' + esc(w.when) + '</div><div><span class="k">Needs</span>' + esc(w.needs) + "</div></div>" +
      '<p class="wwhy"><b>Why chain it:</b> ' + esc(w.why) + "</p>" +
      '<ol class="wsteps">' + w.steps.map(function (s, i) { return wfStep(s, i, w); }).join("") + "</ol>" +
      (w.full ? '<div class="wfoot"><div><span class="k">Budget swap</span>' + esc(w.swap) + '</div><div><span class="k">Notes</span><ul>' + w.notes.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>" : "") +
      '<div class="wlinks"><button type="button" class="linkbtn" data-openrow="' + w.row + '">Open row ' + w.row + " on the router</button></div>" +
      "</article>";
  }
  function renderWorkflows() {
    var wf = DATA.workflows;
    var html = '<div class="eyebrow">Workflows <span class="sep">|</span> as of ' + esc(wf.asOfLong) + "</div>" +
      '<h1 class="title">' + esc(wf.title) + "</h1>" +
      '<p class="lede">' + esc(wf.lede) + "</p>" +
      '<div class="legend wlegend">' +
      PROV_PAGES.map(function (p) { return '<span><span class="wdot ' + p + '"></span>' + esc(DATA.providers[p].label) + "</span>"; }).join("") +
      '<span class="bar"></span><span><span class="wdot you"></span>You</span>' +
      '<span class="tierdef">Filled: an app does the step, in its vendor\'s color. Hollow: you do it.</span></div>' +
      '<div class="seclabel" id="sec-wf-rules">Rules on every workflow</div>' +
      '<div class="wrules"><ol class="teach">' + wf.rules.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ol>" +
      '<dl class="wterms">' + wf.terms.map(function (t) { return "<dt>" + esc(t.term) + "</dt><dd>" + esc(t.text) + "</dd>"; }).join("") + "</dl></div>" +
      '<div class="seclabel" id="sec-wf-index">The fourteen chains at a glance</div>' +
      '<div class="tablewrap"><table class="plain windex"><thead><tr><th>#</th><th>Sales use case</th><th>The chain</th><th>Steps in order</th><th>Depth</th></tr></thead><tbody>' +
      wf.items.map(function (w) {
        return '<tr><td class="n mono">' + w.row + '</td><td class="k"><button type="button" class="linkbtn" data-jump="workflows/wf-' + w.row + '">' + esc(useCase(w.row).name) + "</button></td><td>" + esc(w.chain) + '</td><td class="wdots">' + wfDots(w) + "</td><td>" + (w.full ? '<span class="pill wkitpill">Full kit</span>' : '<span class="pill tier">Step map</span>') + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="seclabel" id="sec-wf-cards">The workflows, row by row</div>' +
      '<div class="wcards">' + wf.items.map(wfCard).join("") + "</div>" +
      '<div class="footer"><span>' + esc(DATA.title) + " " + esc(DATA.version) + "</span><span>The app mechanics on this page were read on the vendor's own pages on " + esc(wf.asOfLong) + "; where a page is silent, the step says so. Receipts on the Sources page.</span></div>";
    q("#page-workflows").innerHTML = html;
  }
  function copyFrom(btn) {
    var pre = q("#" + btn.getAttribute("data-copy"));
    if (!pre) return;
    var text = pre.textContent;
    function selectIt() {
      try { var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "Selected: press Copy"; } catch (e) { /* noop */ }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy prompt"; }, 1600); }, selectIt);
      } else { selectIt(); }
    } catch (e) { selectIt(); }
  }

  /* ---------- sources ---------- */
  function renderSources() {
    var t = todayISO();
    var html = '<div class="eyebrow">Sources <span class="sep">|</span> as of ' + esc(DATA.asOfLong) + "</div>" +
      '<h1 class="title">How the picks are made, and the receipts</h1>' +
      '<div class="seclabel">Methodology</div><div class="prose">' + DATA.methodology.map(function (m) { return "<p>" + esc(m) + "</p>"; }).join("") + "</div>" +
      '<div class="seclabel">Re-verify ledger</div><p class="prose">The claims below expire. Each carries the date it should be re-checked; a row flags itself when that date has passed on your clock (today reads ' + esc(t) + ').</p><div class="ledger">' +
      DATA.volatility.map(function (v) { var due = v.verifyBy <= t; return '<div class="item' + (due ? " due" : "") + '"><div class="vb">' + (due ? "due " : "verify by ") + esc(v.verifyBy) + '</div><div><div class="cl">' + esc(v.claim) + '</div><div class="wy">' + esc(v.why) + "</div></div></div>"; }).join("") + "</div>" +
      '<div class="seclabel">' + esc(DATA.retired.title) + '</div><p class="prose">' + esc(DATA.retired.intro) + '</p><div class="ledger" id="retired">' +
      DATA.retired.items.map(function (r) { return '<div class="item"><div class="vb">removed</div><div><div class="cl">' + esc(r.name) + '</div><div class="wy">' + esc(r.text) + "</div></div></div>"; }).join("") + "</div>" +
      '<div class="seclabel">Watch items, never routed</div><div class="ledger">' +
      DATA.watchList.map(function (w) { return '<div class="item"><div class="vb">' + esc(w.status) + '</div><div><div class="cl">' + esc(w.name) + '</div><div class="wy">' + esc(w.text) + "</div></div></div>"; }).join("") + "</div>" +
      '<div class="seclabel">' + esc(DATA.changeLog.title) + '</div><div class="strip" style="margin-top:0"><div class="body" style="padding-top:8px"><ul>' +
      DATA.changeLog.items.map(function (it) { return '<li><span class="d">' + esc(it.date) + "</span><span>" + esc(it.text) + "</span></li>"; }).join("") + "</ul></div></div>" +
      '<div class="seclabel" id="sec-specs">Model specs and prices</div><p class="prose">The figures that left the model cards: release date, context window in tokens, output cap, list prices per million tokens, what each model takes in and whether it makes files. ' + esc(TIER_RULE) + ' Promotional and introductory prices are used as listed and dated on the ledger above; the tiers hold when they expire.</p>' + specsTable() +
      '<div class="seclabel">Benchmark appendix</div><p class="prose">' + esc(DATA.benchmarks.note) + "</p>" +
      DATA.benchmarks.tables.map(function (tb) {
        return '<div class="bench" style="margin-top:18px"><h3>' + esc(tb.title) + '</h3><div class="tablewrap"><table class="plain"><thead><tr>' + tb.columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          tb.rows.map(function (r) { return "<tr>" + r.map(function (c, i) { return "<td" + (i === 0 ? ' class="k"' : "") + ">" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div></div>";
      }).join("") +
      '<div class="seclabel">Source list</div>' +
      DATA.sources.map(function (g) {
        return '<div class="srcgroup"><h3>' + esc(g.group) + "</h3><ul>" + g.items.map(function (s) {
          return "<li>" + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>" : esc(s.label)) + '<span class="d">' + esc(s.date) + "</span>" + (s.note ? ' <span class="n">' + esc(s.note) + "</span>" : "") + "</li>";
        }).join("") + "</ul></div>";
      }).join("") +
      '<div class="footer"><span>' + esc(DATA.title) + " " + esc(DATA.version) + "</span><span>Static and deterministic. No live calls, no tracking.</span></div>";
    q("#page-sources").innerHTML = html;
  }

  /* ---------- routing ---------- */
  function showPage(key, cardId) {
    if (PAGES.indexOf(key) < 0) key = "router";
    state.page = key;
    qa(".page").forEach(function (p) { p.classList.toggle("active", p.id === "page-" + key); });
    renderNav();
    var hash = "#" + key + (cardId ? "/" + cardId : "");
    if (location.hash !== hash) { try { history.replaceState(null, "", hash); } catch (e) { /* noop */ } }
    if (cardId) {
      var el = q("#model-" + cardId) || q("#" + cardId);
      if (el) {
        if (el.tagName === "DETAILS") el.open = true;
        el.scrollIntoView({ block: "start" });
        el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
      }
    } else {
      window.scrollTo(0, 0);
    }
  }
  function openCard(id) {
    var m = model(id);
    if (!m) return;
    var pid = DATA.providers[m.provider] ? m.provider : null;
    if (!pid) return;
    showPage(pid, id);
  }
  function fromHash() {
    var h = (location.hash || "#router").slice(1);
    var parts = h.split("/");
    var key = parts[0] || "router";
    var card = parts[1] || null;
    if (PAGES.indexOf(key) < 0) key = "router";
    showPage(key, card);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var cp = e.target.closest("[data-copy]");
    if (cp) { copyFrom(cp); return; }
    var orow = e.target.closest("[data-openrow]");
    if (orow) {
      var rn = Number(orow.getAttribute("data-openrow"));
      state.group = "all"; state.text = ""; state.openRow = rn;
      renderRouter(); showPage("router");
      var tr = q('tr.row[data-row="' + rn + '"]'); if (tr) tr.scrollIntoView({ block: "center" });
      return;
    }
    var j = e.target.closest("[data-jump]");
    if (j) { closeMenus(); var parts = j.getAttribute("data-jump").split("/"); showPage(parts[0], parts[1]); return; }
    var tg = e.target.closest("[data-ddtoggle]");
    if (tg) { var dd = tg.closest(".navdd"); if (dd.classList.contains("open")) closeMenus(); else openMenu(dd); return; }
    if (!e.target.closest(".navdd")) closeMenus();
    var t = e.target.closest("[data-nav]");
    if (t) { closeMenus(); showPage(t.getAttribute("data-nav")); return; }
    var c = e.target.closest("[data-card]");
    if (c) { e.stopPropagation(); openCard(c.getAttribute("data-card")); return; }
    var a = e.target.closest("[data-anchor]");
    if (a) { var el = q("#" + a.getAttribute("data-anchor")); if (el) el.scrollIntoView({ block: "start" }); return; }
    var g = e.target.closest("[data-group]");
    if (g) { state.group = g.getAttribute("data-group"); store("str.group", state.group); renderRouter(); return; }
    var r = e.target.closest("tr.row");
    if (r) { var n = Number(r.getAttribute("data-row")); state.openRow = state.openRow === n ? null : n; renderRouter(); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeMenus(); return; }
    if (e.key !== "Enter" && e.key !== " ") return;
    var r = e.target.closest && e.target.closest("tr.row");
    if (r && e.target === r) { e.preventDefault(); var n = Number(r.getAttribute("data-row")); state.openRow = state.openRow === n ? null : n; renderRouter(); var nr = q('tr.row[data-row="' + n + '"]'); if (nr) nr.focus(); }
  });
  window.addEventListener("hashchange", fromHash);

  /* ---------- boot ---------- */
  function measureTop() {
    var tb = q(".topbar");
    if (tb) document.documentElement.style.setProperty("--topbar-h", (tb.offsetHeight + 1) + "px");
  }
  window.addEventListener("resize", measureTop);
  var hoverTimer = null;
  document.addEventListener("mouseover", function (e) {
    if (!window.matchMedia || !window.matchMedia("(hover: hover)").matches) return;
    var dd = e.target.closest(".navdd");
    clearTimeout(hoverTimer);
    if (dd) { if (!dd.classList.contains("open")) hoverTimer = setTimeout(function () { openMenu(dd); }, 120); }
    else if (!e.target.closest("#nav")) hoverTimer = setTimeout(closeMenus, 200);
  });
  function boot() {
    measureTop();
    renderRouter();
    renderWorkflows();
    renderBP();
    PROV_PAGES.forEach(renderProvider);
    renderSources();
    fromHash();
    measureTop();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureTop);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>

</body>
</html>
