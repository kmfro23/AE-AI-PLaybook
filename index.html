<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Seventeen enterprise-sales use cases routed to the best AI model at three cost tiers, with the exact reasoning setting, and workflows for fourteen of them that chain Claude and ChatGPT. Updated October 1, 2026.">
<title>The Sales Task Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root {
  --bg: #fafaf8;
  --bg-deep: #f3efe8;
  --panel: #f6f3ee;
  --ink: #1c1917;
  --ink-2: #44403c;
  --muted: #6f6861;
  --hair: #e6e1da;
  --hair-2: #d6cfc6;
  --accent: #b45309;
  --accent-ink: #7c3a06;
  --accent-soft: #f9ecdd;
  --peak: #fbf4e8;
  --balanced: #ffffff;
  --value: #eef4f0;
  --good: #166534;
  --warn: #b45309;
  --neutral: #6f6861;
  --p-anthropic: #b45309;
  --p-openai: #0f766e;
  --p-google: #1d4ed8;
  --p-xai: #1c1917;
  --p-other: #6b7280;
  --display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  --maxw: 1120px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 500; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.1em; }
li + li { margin-top: 0.35em; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: 20px; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(250, 250, 248, 0.94); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--hair);
}
.topbar .wrap { display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .name { font-family: var(--display); font-size: 22px; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 13px; }
.nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav .navlabel { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 6px 0 10px; }
.navbtn {
  background: transparent; border: 1px solid transparent; border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2);
}
.navbtn:hover { background: var(--panel); }
.navbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.navbtn.due { border-color: var(--accent); color: var(--accent-ink); }
.navbtn.due:hover { background: var(--accent-soft); }
.navdd { position: relative; display: inline-flex; align-items: center; }
.navdd .navbtn { padding-right: 8px; border-radius: 999px 0 0 999px; }
.navcaret {
  background: transparent; border: 1px solid transparent; border-radius: 0 999px 999px 0; cursor: pointer;
  padding: 6px 9px 6px 4px; font-size: 11px; color: var(--muted); line-height: 1.5;
}
.navdd:hover .navbtn:not(.active), .navdd.open .navbtn:not(.active) { background: var(--panel); }
.navdd:hover .navcaret, .navdd.open .navcaret { background: var(--panel); color: var(--ink); }
.navdd .navbtn.active + .navcaret { background: var(--accent); color: #fff; border-color: var(--accent); }
.menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 250px; max-width: min(320px, calc(100vw - 32px));
  max-height: calc(100vh - 90px); overflow-y: auto; background: #fff; border: 1px solid var(--hair-2); border-radius: 8px; padding: 6px;
  box-shadow: 0 12px 28px rgba(28, 25, 23, 0.14);
}
.menu.alignr { left: auto; right: 0; }
.navdd.open .menu { display: block; }
.menu .mgroup { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px 4px; }
.menu .msep { height: 1px; background: var(--hair); margin: 6px 4px; }
.menu .mitem {
  display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 6px 10px; font-size: 13.5px; color: var(--ink); cursor: pointer;
}
.menu .mitem:hover, .menu .mitem:focus-visible { background: var(--accent-soft); color: var(--accent-ink); outline: none; }
.menu .mitem.dim { color: var(--muted); }
.seclabel, .scard, .nuance, h3.h.anchor { scroll-margin-top: calc(var(--topbar-h, 57px) + 33px); }
h3.h.anchor { margin-top: 14px; }
.nuance.flash, h3.h.anchor.flash { animation: flash 1.6s ease-out 1; }
.seclabel.flash { background: var(--accent-soft); color: var(--accent-ink); }
.scard.flash { animation: flash 1.6s ease-out 1; }

main { padding-block: 34px 80px; }
.page { display: none; }
.page.active { display: block; }

.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.eyebrow .sep { color: var(--hair-2); margin: 0 6px; }
h1.title { font-family: var(--display); font-size: clamp(30px, 4vw, 42px); line-height: 1.1; margin-top: 8px; letter-spacing: -0.01em; }
.lede { max-width: 68ch; color: var(--ink-2); margin-top: 12px; font-size: 16px; }
/* Section headers: bold, larger, on a backdrop, so each section of a page stands out from the cards and tables under it. */
.seclabel {
  display: block; margin: 44px 0 16px; padding: 10px 14px;
  font-size: 19px; line-height: 1.3; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink);
  background: var(--bg-deep); border-left: 4px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0;
  text-wrap: balance;
}
h2.h { font-family: var(--display); font-size: 26px; margin: 4px 0 10px; }
h3.h { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
.prose { max-width: 72ch; color: var(--ink-2); }
.prose p + p { margin-top: 0.8em; }

/* ---------- legend and chips ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.anthropic { background: var(--p-anthropic); }
.dot.openai { background: var(--p-openai); }
.dot.google { background: var(--p-google); }
.dot.xai { background: var(--p-xai); }
.dot.other { background: var(--p-other); }
.legend .tierdef { color: var(--muted); }
.legend .bar { width: 1px; height: 14px; background: var(--hair-2); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.chip {
  border: 1px solid var(--hair-2); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2);
}
.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips input {
  font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--hair-2); border-radius: var(--radius); background: #fff; color: var(--ink); min-width: 200px;
}
.chips .count { margin-left: auto; color: var(--muted); font-size: 13px; }

/* ---------- what changed strip ---------- */
.strip { margin-top: 22px; border: 1px solid var(--hair); border-left: 3px solid var(--accent); background: #fff; border-radius: var(--radius); }
.strip summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
.strip summary::-webkit-details-marker { display: none; }
.strip summary .tw { display: inline-block; transition: transform 0.15s; color: var(--muted); font-size: 12px; }
.strip[open] summary .tw { transform: rotate(90deg); }
.strip .body { padding: 0 14px 12px; }
.strip ul { list-style: none; padding: 0; }
.strip li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; font-size: 14px; color: var(--ink-2); padding: 5px 0; border-top: 1px solid var(--hair); }
.strip li:first-child { border-top: 0; }
.strip .d { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 3px; }

/* ---------- matrix ---------- */
.tablewrap { overflow-x: auto; margin-top: 18px; border: 1px solid var(--hair); border-radius: var(--radius); background: #fff; }
@media (min-width: 921px) { .tablewrap.matrixwrap { overflow-x: visible; } }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 860px; }
table.matrix thead th {
  position: sticky; top: var(--topbar-h, 57px); z-index: 2; background: var(--bg-deep);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--hair-2);
}
table.matrix thead th.peak { background: #f4e9d6; }
table.matrix thead th.value { background: #e2ebe6; }
/* Below 921px the matrix scrolls sideways inside .tablewrap, which makes the wrapper the header's scroll container;
   an offset equal to the top bar there pushed the header bar below row 1 (Kyle, October 1), so it sits at 0. */
@media (max-width: 920px) { table.matrix thead th { top: 0; } }
table.matrix td { vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--hair); }
table.matrix tr.row { cursor: pointer; }
table.matrix tr.row:hover td { background-color: #fdfcfa; }
table.matrix tr.row.open td { background-color: #fdfaf5; }
table.matrix tr.row td.peak { background: var(--peak); }
table.matrix tr.row td.balanced { background: var(--balanced); }
table.matrix tr.row td.value { background: var(--value); }
table.matrix tr.row:hover td.peak, table.matrix tr.row.open td.peak { background: #f7ecd9; }
table.matrix tr.row:hover td.value, table.matrix tr.row.open td.value { background: #e6efe9; }
td.n { width: 34px; color: var(--accent); font-family: var(--mono); font-size: 12px; padding-top: 12px; }
td.uc { width: 26%; }
td.uc .ucname { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
td.uc .ucmeta { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill {
  display: inline-block; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700;
  border-radius: 4px; padding: 1px 6px; line-height: 1.5; border: 1px solid transparent;
}
.pill.ev-A { color: var(--good); background: #e6f2ea; border-color: #c7e2d0; }
.pill.ev-B { color: var(--accent-ink); background: #f9ecdd; border-color: #eed7bb; }
.pill.ev-C { color: var(--neutral); background: #efece7; border-color: #ddd6cc; }
.pill.status-live { color: var(--good); background: #e6f2ea; border-color: #c7e2d0; }
.pill.status-displaced { color: var(--neutral); background: #efece7; border-color: #ddd6cc; }
.pill.status-restricted, .pill.status-watch { color: var(--accent-ink); background: #f9ecdd; border-color: #eed7bb; }
.pill.status-unrouted { color: var(--neutral); background: #f5f2ed; border-color: #e2dbd1; }
.pill.tier { color: var(--muted); background: transparent; border-color: var(--hair-2); }
.pill.surface { color: #1d4ed8; background: #e8eefc; border-color: #c9d6f7; }
.tipwrap { position: relative; display: inline-block; }
.tipwrap .tip {
  display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; width: 280px;
  background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.45; padding: 9px 11px; border-radius: 6px;
  text-transform: none; letter-spacing: 0; font-weight: 400;
}
.tipwrap:hover .tip, .tipwrap:focus-within .tip { display: block; }
.tipwrap .tip b { color: #fcd9b6; }

.pick { display: flex; flex-direction: column; gap: 2px; }
.pick .mname { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.pick .mname button {
  background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left;
  color: var(--ink); text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
}
.pick .mname button:hover { text-decoration-color: var(--accent); color: var(--accent-ink); }
.pick .dial { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.pick .dial.empty { color: var(--muted); font-style: italic; font-family: var(--body); }

tr.expand td { background: #fff; border-top: 0; padding: 0 12px 16px; }
.exp { border-top: 1px dashed var(--hair-2); padding-top: 14px; }
.exp .why3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.exp .why { padding: 12px 14px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.5; color: var(--ink-2); border: 1px solid var(--hair); }
.exp .why.peak { background: var(--peak); }
.exp .why.balanced { background: var(--balanced); }
.exp .why.value { background: var(--value); }
.exp .why .lab { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.exp .why .who { font-weight: 600; margin: 4px 0 6px; color: var(--ink); }
.exp .why .who .dial { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-weight: 400; }
.exp .notes { margin-top: 12px; display: grid; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.exp .note { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 8px 10px; background: var(--panel); border-radius: var(--radius); }
.exp .note .k { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-top: 2px; }
.exp .primary { margin-top: 12px; font-size: 13px; color: var(--muted); }
.exp .primary b { color: var(--ink-2); font-weight: 600; }

/* ---------- provider pages ---------- */
.moat { margin-top: 14px; padding: 16px 18px; background: #fff; border: 1px solid var(--hair); border-left: 3px solid var(--accent); border-radius: var(--radius); }
.moat .ms { font-family: var(--display); font-size: 22px; line-height: 1.25; }
.moat .md { margin-top: 10px; color: var(--ink-2); max-width: 80ch; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.jump .chip { font-size: 12.5px; }

.mcard {
  position: relative; background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 18px 20px 18px 24px; margin-top: 16px;
  scroll-margin-top: calc(var(--topbar-h, 57px) + 33px);
}
.mcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: var(--radius) 0 0 var(--radius); background: var(--pc, var(--accent)); }
.mcard.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); } 100% { box-shadow: none; } }
.mcard .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mcard .head h3 { font-size: 20px; font-weight: 600; margin: 0; }
.mcard .head .ptag { font-size: 12px; color: var(--muted); }
.mcard .purpose { margin-top: 6px; color: var(--ink-2); max-width: 80ch; }
.specbar { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; padding: 10px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.spec { font-size: 12.5px; }
.spec .k { color: var(--muted); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; display: block; }
.spec .v { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.spec .v.txt { font-family: var(--body); font-size: 12.5px; }
.specbar.three { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 6px 22px; align-items: start; }
table.plain.specs { min-width: 1180px; }
table.plain.specs td.k { width: 150px; }
.pricenote { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.mcard .unroutednote { margin-top: 6px; font-size: 13px; color: var(--muted); max-width: 80ch; }
.mcard .unroutednote b { color: var(--ink-2); font-weight: 600; }
.ladder { margin-top: 12px; }
.ladder .k { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.rungs { display: flex; flex-wrap: wrap; gap: 6px; }
.rung { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border: 1px solid var(--hair-2); border-radius: 4px; background: var(--panel); color: var(--ink-2); }
.rung.def { background: var(--accent); color: #fff; border-color: var(--accent); }
.ladder .lnote { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.ladder .dtext { font-size: 12.5px; color: var(--ink-2); }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
.twocol h4 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.twocol ul { font-size: 13.5px; color: var(--ink-2); }
.folds { margin-top: 12px; display: grid; gap: 6px; }
.fold { border: 1px solid var(--hair); border-radius: var(--radius); background: var(--panel); }
.fold summary { cursor: pointer; padding: 8px 12px; font-size: 13.5px; font-weight: 600; list-style: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::before { content: "+"; display: inline-block; width: 14px; color: var(--accent); font-weight: 700; }
.fold[open] summary::before { content: "\2013"; }
.fold summary .c { color: var(--muted); font-weight: 400; margin-left: 6px; }
.fold ul { padding: 0 14px 12px 28px; font-size: 13.5px; color: var(--ink-2); }
.srcnote { margin-top: 10px; font-size: 12px; color: var(--muted); }

.fold .pbody { padding: 0 14px 12px; font-size: 13.5px; color: var(--ink-2); }
.fold .pbody .plead { margin: 0 0 4px; }
.fold .pbody .psub { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 10px 0 4px; }
.fold .pbody ul { padding: 0 0 0 28px; }
.fold .pbody pre.tpl { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--body); font-size: 13.5px; line-height: 1.5; color: var(--ink); background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 10px 12px; }
.fold .pbody .srcnote { margin-top: 10px; }
.fold.pfold { scroll-margin-top: calc(var(--topbar-h, 57px) + 33px); }
.fold.pfold.flash { animation: flash 1.6s ease-out 1; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.linkbtn:hover { color: var(--accent); }
table.pdiff { min-width: 900px; font-size: 13px; }
table.pdiff td { vertical-align: top; }
.menu .mitem.sub { padding-left: 22px; font-size: 13px; }
.mcard.compact { padding: 12px 16px 12px 20px; }
.mcard.compact .head h3 { font-size: 16px; }
.mcard.compact .purpose { font-size: 13.5px; }
.mcard.compact .specbar { padding: 8px 0 0; border-bottom: 0; }
.cardgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.cardgrid2 .mcard { margin-top: 0; }
.scard { background: #fff; border: 1px solid var(--hair); border-radius: var(--radius); padding: 16px 18px; }
.scard .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.scard h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
/* Surface card text: the one-sentence description is the lead line, 15px dark ink on a tinted panel, with a divider under it.
   Section headings (Capabilities, Strengths, When to use, Best practices, Limitations) are 15px semibold in sentence case over
   13.5px body, sitting closer to their own text than to the section above. Model cards keep their small caps labels. */
.scard .what { margin-top: 10px; padding: 10px 12px; background: var(--panel); border-radius: var(--radius); font-size: 15px; line-height: 1.45; color: var(--ink); }
.scard dl { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); display: grid; font-size: 13.5px; }
.scard dt { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); margin: 14px 0 4px; }
.scard dt:first-child { margin-top: 0; }
.scard dd { margin: 0; color: var(--ink-2); }
.scard ul { font-size: 13.5px; color: var(--ink-2); }

/* Per-model prompting templates. Each live model gets its own shape because the models differ in what they need.
   Templates use plain bracketed inputs, [paste the transcript], never double-brace placeholders. Rules and never-lists carry at most
   four lines each and only what a seller can act on inside the app; developer-only controls are out. Version 16 splits the two folds
   by job: this fold holds the words (the template, what to write, what never to write); the card's "Get the most from it" holds the
   moves inside the app (which app, which setting, when to switch models, how to check the output). No line appears in both. */

    diff: { shape: "Context, task, per-item steps, own-words rule, autonomy rules, grounded progress, closing recap", effort: "Research, synthesis and deal artifacts high; the hardest deal review xhigh; writing medium", length: "Ask for a recap that stands on its own and no mannered prose; it writes densely by default", verify: "Tell it to tie every progress claim to a real result before reporting", never: "Write out your reasoning; accepting its offer to hand off mid-task" },

      "When the answer depends on current facts, say 'search for current information before answering'; at low effort it otherwise answers from memory more often.",

    diff: { shape: "All source material in one tagged block, the task, every-item scope, what to return and where to stop, format", effort: "Chat medium (the app's default), extraction low; drafts that go out, plans, research, proposals and business cases high; xhigh or max only with a measured gain", length: "Replies get much longer at xhigh and max; state a length when you need a size", verify: "Count outputs against inputs, and check any fact that may have changed since its June 2026 cutoff", never: "Asking it to write out its reasoning; wording that discourages searching" },
    template: "<source_material>\n[paste every document, in one block]\n</source_material>\n\n[the task: build a single structured record from the material above]\n\nExtract these fields for every one of the [number] documents, not just the first: [the field list].\n\nReport every item you find, including ones you are uncertain about, each with your confidence. A separate step will filter them, so do not filter here.\n\nWhere a field is absent, write \"not stated\" rather than carrying a value across from another document.\n\nKeep going until every document is done, and only stop if you cannot go on without me.\n\nReturn only the table, one row per document, and stop there: [the format].",
    rules: [
      "State scope in words that cover every item ('every section, not just the first one'), and separate finding from filtering: ask for everything with a confidence, then filter in a second step.",
      "Say what to return and where to stop: 'ideas only; do not build anything yet', or 'the table only'.",
      "On a long job, say 'keep going until everything is done, and only stop if you cannot go on without me'.",
      "Ask it to search for anything that may have changed, such as what is allowed, required or charged, and paste the link when you want one page read."

    never: [

      "Do not discourage searching ('only search if strictly necessary'); it already answers from memory at times when a search would catch a change.",

  dialTeaching: [
    "The leverage is in picking the right mode of the right model, not just the right app.",
    "Claude's dial is effort, and it shapes the whole reply: how much it thinks, how many searches and lookups it runs, and how much it explains. There is no verbosity knob; when you need a size, ask for length in words.",
    "In Claude you can change the model, effort or thinking setting at any point in a chat, and the change applies from the next reply: run the deal review at high, then drop to low to reformat the notes.",
    "Effort and length are two different controls. Effort sets how much the model thinks; verbosity, an OpenAI developer setting, sets how long the answer is. Neither Claude nor ChatGPT offers a length setting in the app, so ask for the size in words ('five lines, no preamble'), or in ChatGPT pick the Efficient style.",
    "Claude thinks adaptively: it decides how much to think on each reply, and effort steers that. The older fixed thinking budget, extended thinking, is gone from Opus 5.5, Fable 5.1 and Sonnet 5.5; you choose the effort, not a thinking budget.",
    "Max and Ultra are not the same thing. Max (Anthropic and OpenAI) is deeper reasoning on one task. Ultra (OpenAI, Work and Codex only) is parallel subagents on separable parts.",
    "Gemini's app setting is a thinking level: Standard, Extended and, on AI Ultra with the Pro model, Deep think. Google does not map them to the developer levels, so the router names the app setting.",
    "Grok's app has modes, not an effort dial: Fast, Expert and, on the top plan by press reports, Heavy. The low-to-xhigh effort ladder is a developer setting.",
    "At max effort the two flagships take minutes before the first word. Route interactive work to high or medium, and step up only where a higher setting measurably improves the result.",
    "Effort helps some tasks and not others. Deep reasoning, long documents and research reward it. Reformatting, quick questions and real-time triage get slower without getting better, and on Claude plans higher effort also uses up your limits faster. Sonnet 5.5 is the clearest exception: its finished work scores far better at high than at medium, and the router runs it at max on nine picks."
  ],
  surfacesIntro: "Second lever after the dial: where the work belongs. Every provider now splits into a chat surface for thinking out loud and an agent surface that produces finished files on a schedule. Picking the surface is often worth more than picking the model.",

    { provider: "Anthropic", chat: "Claude, in conversation: the call plan from the CRM record and the thread, the battlecard from research, the outreach draft in your voice, the live role play in voice mode.", agent: "Claude, running a task: the TCO workbook and the deck as real files, the MEDDPICC framework saved as a skill, the weekly report on a scheduled task that runs in the cloud.", note: "On Pro and Max, chat and Cowork are becoming one conversation that decides when to run a task (rolling out since September 16), Team and Enterprise still choose Chat or Cowork in the message box, and anything touching files on your computer needs the desktop app open." },

  readingTiers: [
    "Peak Performance is the top score on the row's rubric among the settings that pass its limits, with cost ignored (row 9 is the exception: its Peak is set by hand, and its note gives the rubric's top score). Reach for it when being wrong is expensive: a board-level deal review, an RFP that decides the quarter.",
    "Balanced is the best mix of 70% score and 30% cost among the other models' settings within 10 points of Peak. The default for most live work: a strong result at a sensible cost.",
    "Best Value is the best mix of 25% score and 75% cost among a third model's settings within 50 points of Peak. Cost nearly always decides: a setting ten times cheaper wins unless it scores 150 points lower, so Best Value often sits far below Peak. On three rows it costs more than Balanced; read its why line for what it gives up before you use it on work a customer sees.",
    "Cost is counted in multiples, not dollars: every Balanced and Best Value why line says how the pick's cost per job compares with Peak's, from what the independent tests cost to run at developer prices. On a subscription you pay through plan limits, where the multiple roughly carries over.",
    "No model repeats within a row, so each row shows real choices across models, usually from more than one vendor. The trade-off: when the cheaper setting belongs to a model already in the row, a Best Value pick can cost more than Balanced, or Balanced more than Peak; the why line says so, and the note names the rubric's own pick that the rule set aside. When no third model passes a row's limits, Best Value stays empty."
  ],
  promptingPrinciples: [
    "Be clear and direct. State the output, format and constraints, and ask outright for above-and-beyond work. The test: would a colleague with no context follow your prompt? If not, the model will not either.",
    "Add context and motivation. Explaining why a rule matters produces more targeted output than the rule alone.",
    "Use a few examples when format, tone or structure matters: close to the real task, varied enough that it does not copy one pattern, and each wrapped in example tags so it can tell them from your instructions.",
    "Give a definition of done. The saved output and the check that would catch a meaningful mistake, not the activity.",
    "Open with a one-sentence role and a focus line: the role sets behavior and tone, the focus says what to attend to. State the shape you want as an instruction ('write in flowing paragraphs'), not a ban ('no markdown').",
    "Say whether you want action or advice. 'Change this' is an instruction to act; 'can you suggest changes' can get suggestions instead. If it answers from memory when it should check, tell it to use its tools before answering.",
    "Put long documents first and your question last, and for a long document ask it to quote the relevant passages before it answers.",
    "Treat retrieved pages and pasted documents as evidence, never as instructions. A sentence inside a document is not a command to change the task."
  ],
  nuances: [
    { family: "Claude Fable 5.1", items: [
      "Never ask it to write out or repeat its reasoning in the reply; that can be refused (Anthropic says 'explain your reasoning' is fine on Opus 5.5 and says nothing either way for Fable). To see how it got there, open the Thinking section above the answer, which shows a summary.",
      "Ground its progress claims: tell it to check every status against a real result before reporting.",
      "On long runs it goes quiet, and its last message can cover only the final step. Ask for a closing recap that stands on its own.",
      "Instructions written for earlier models can over-steer it, from Skills to 'no bullet points' rules. If output disappoints, run once without them.",
      "Flagged cybersecurity and biology requests move to an Opus model mid-turn, and no earlier model can read Fable's reasoning, so that answer is built without it. Restate anything it needs."
    ]},
    { family: "Claude Opus 5.5", items: [
      "Start at medium, the default. It matches Opus 5 at high on Anthropic's tests and Opus 5 at max on the independent intelligence test, and each level tends to think more than it did on Opus 5, so xhigh and max are slower than you remember.",
      "For a task across your tools, tell it to look through the relevant emails, tabs and records before acting, including ones you did not name; otherwise it gets to work on what it was pointed at.",
      "On a long unattended run it may end a turn with a summary that announces the next step. Say up front that it should finish without checking in; if it still stops, reply 'continue' and name the open items.",
      "In a long chat it sometimes re-reads earlier answers on a follow-up. Telling it to treat earlier answers as settled makes follow-ups start faster, but it then flags its own earlier mistakes less; leave that out of a deal review.",
      "Asking it to repeat its reasoning word for word is blocked outright; 'explain your reasoning' is fine. Flagged cybersecurity requests move to Opus 4.8 and biology requests to Opus 5, with a notice in the chat. Your Opus 5 prompts still work; try one run without the length and narration lines."
    ]},
    { family: "Claude Sonnet 5.5", items: [
      "Say what you want back and where to stop. On an open-ended ask, or at higher effort, it can do more than you asked, such as starting a deck when you wanted ideas.",
      "At low and medium it can stop partway through a long job to check in. Tell it to keep going until everything is done, or raise the level.",
      "It sometimes answers from memory when a search would catch a change. Ask it to search for anything that may have changed, such as what is allowed, required or charged.",
      "Your Sonnet 5 prompts still work; your Sonnet 5 effort settings do not carry over, because the levels are recalibrated, and thinking stays on."
    ]},
    { family: "GPT-6 Astra", items: [
      "It asks more clarifying questions than the 5.6 line. Tell it which routine decisions it may make and where to stop.",
      "Give a concrete definition of done: the saved output plus the check.",
      "It is sensitive to instructions in files and skills. When behavior seems inexplicable, ask it to name the file and the rule.",
      "Work and Codex share one allowance, and Astra spends it faster than Sol. Check the usage display before a large run.",
      "Settle the hard decision in Chat (GPT-6 Pro), then hand Work the approved conclusion and the deliverable spec."
    ]},
    { family: "GPT-5.6 Sol and the GPT-6.1 Sol and Luna line", items: [
      "For a short, well-reasoned answer from GPT-5.6 Sol in Chat, pick High on the Thinking slider and ask for the length in words; Chat has no verbosity setting.",
      "The 5.6 line guesses instead of declining more than any other frontier family; GPT-6.1 Sol still guesses on about half of its misses and Luna on most. Keep them grounded in search results or your own documents, and ask for the source line.",
      "Contradictory instructions are expensive; it spends reasoning tokens reconciling them.",
      "Do not add 'think step by step'. Reasoning is built in.",
      "GPT-6 Luna, the Best Value pick on eleven rows for its price, guesses on most of its misses: give it the facts, keep it to drafts and extraction a person checks, and move to GPT-6.1 Sol when the categories are ambiguous. Both live in Work and Codex, not Chat; pick GPT-6.1 Sol under Advanced, since no Power preset runs it (the Sol presets still run GPT-6 Sol)."
    ]},
    { family: "Gemini Flash line", items: [
      "Constraints and formatting rules at the end of the prompt.",
      "The default is terse; ask for detail explicitly.",
      "Leave temperature alone; the sampling knobs are deprecated on this generation.",
      "Personas are taken seriously, sometimes over other instructions. Check alignment.",
      "Point it at the recording or the PDF, not a transcript or a paste; native input is the point."
    ]},
    { family: "Grok 4.6", items: [
      "Pick the mode on purpose: Fast for a quick read, Expert when you will act on the answer. For developers, the default high is slow for chat.",
      "Ask it to cite the X post or page behind every claim; it is calibrated, not omniscient.",
      "State verifiable constraints precisely; older independent tests found the Grok line adhered tightly to counts, formats and banned words, and the current models have not been re-tested on that measure.",
      "Keep inputs under 200K tokens or the price doubles."
    ]}
  ],
  architecture: [
    { term: "Tokens and tokenizers", text: "Models read and bill in tokens, roughly three quarters of a word. Different tokenizers count the same text differently: Claude's 4.7-and-later models produce about 30% more tokens than the 4.6 generation for the same text, so any budget or cost estimate carried over from older Claude models is about 30% short. Two models at the same list price can cost different amounts on the same job." },
    { term: "Context windows and effective context", text: "The window is how much the model can hold at once, counted in tokens; Google's help pages put 1M tokens at about 1,500 pages, and a page can be counted many ways. PDFs fill it faster: Claude reads each PDF page as text plus an image of the page, and the text alone typically runs 1,500 to 3,000 tokens a page. Effective context is smaller: independent multi-needle tests, which hide several facts across a long document and ask the model to find them all, show recall dropping as documents grow, and dropping fastest on some models (Gemini 3.1 Pro recalls a quarter of the needles at 1M in Google's own card). Some vendors also bill differently past a threshold: OpenAI bills the whole request at double the input price and one and a half times the output price once input passes 272K tokens, Grok doubles past 200K." },
    { term: "Thinking and effort", text: "Thinking is the model working a problem before it answers; Claude restates the ask, tries approaches and checks intermediate results. It costs time and tokens even when hidden, and Claude's Thinking section shows a summary, never the raw reasoning. Effort sets how much work goes into the whole reply: on Claude, how much it thinks, how many tool calls it makes and how much it explains. Deal review, long documents and research reward more effort; reformatting and quick questions mostly get slower (Sonnet 5.5's finished work is the exception: it scores far better at high), and on Claude plans higher effort uses up your limits faster. Effort is not a length control; when you need a size, ask for length in words. The wait times the router quotes are independent medians of the time to the first streamed token through the developer interface; for a thinking model that can be the start of its thinking, and the app may differ." },
    { term: "Effort versus verbosity", text: "Two different dials. Reasoning effort sets how much the model thinks before it answers. Verbosity, an OpenAI developer setting (low, medium or high; medium by default), sets how long the final answer is, and OpenAI documents it for its GPT-5 models. Effort can change the length as a side effect (at low effort Claude narrates less around its tool calls), but it is not a length control. Neither the Claude nor the ChatGPT app has a length setting: ask for the size in words ('five lines, no preamble'), or in ChatGPT pick the Efficient base style, which answers directly and briefly." },
    { term: "Adaptive versus extended thinking", text: "Anthropic's two ways of thinking. Adaptive thinking, the only mode on Opus 5.5, Fable 5.1 and Sonnet 5.5, lets the model decide on each reply whether and how much to think, and effort steers that decision; at low effort it can skip thinking on an easy question. Extended thinking was the older mode, where a developer fixed a thinking budget and the model thought on every request; these three models reject it. The Claude app's toggle can still be labelled Extended, but on all three thinking cannot be turned off in the app. OpenAI has no setting by either name: its models spend fewer tokens on easy tasks and more on hard ones within the effort you pick, and ChatGPT Business can add thinking on its own while Instant is selected." },
    { term: "Tool use and agent loops", text: "An agent is a model calling tools (search, a browser, a spreadsheet, your CRM through a connector) in a loop until the job is done. Claude calls a tool when your request matches what the tool does and the answer is not already in the conversation, and with thinking on it reasons about each result before the next step. If it answers from memory when you wanted a check, tell it to use its tools first. Two things make agent runs reliable: a definition of done the model can check, and a rule that progress claims must point to a tool result. The independent SaaS-workflow and terminal boards measure exactly this loop." },
    { term: "Hallucination versus calibration", text: "Every model gets some questions wrong. The metric that matters for sales is what it does when it does not know: guess confidently, or say so. The independent test used on the Sources page reports the share of wrong answers that were guesses. Grok 4.6 guesses on a quarter of its misses at xhigh and a third at its default high, Grok 4.7 on about three in ten at xhigh; GPT-6.1 Sol on about half and the GPT-5.6 line on nine in ten. Grounding a model in search results or your own documents reduces the problem; it does not remove the habit." },
    { term: "Prompt caching", text: "Every vendor charges a fraction of the input price for tokens it has recently seen. Long system prompts, a stable document set and a stable answer library are cheap to reuse if you keep them at the top of the prompt where the cache can match them. Fable 5.1's cache reads dropped to a quarter of Fable 5's in September, which is why a long agentic session on it costs far less than list price suggests." }
  ]
};

DATA.methodology = [
  "Performance for a row is its score on the router's grading rubric (saved September 30, 2026): 43 measurements from Artificial Analysis's independent tests, each rescaled from 0 to 100 across the settings measured, then weighted for the use case (account research, for example, puts 20% on the guess rate, 20% on business knowledge and 15% on the quality of the analysis). Every model is scored at each effort level it was tested at, through the developer interface; the app can behave differently. The why lines give gaps in points on that 0 to 100 score, and benchmark names and numbers stay on this page.",
  "Cost comes from the same tests: what each one cost to run at developer list prices, weighted like performance and counted on a log scale, so each tenfold saving adds the same amount. Peak is the top performance score among the settings that pass the row's limits, except on row 9, where it is set by hand and the row's note gives the rubric's top score. Balanced then takes the best mix of 70% performance and 30% cost within 10 points of Peak, and Best Value the best mix of 25% performance and 75% cost within 50 points. The why lines give each pick's cost as a multiple of Peak's; on a subscription the dollars differ, and the multiple roughly carries over.",
  "Limits: a row can cap the guess rate (the share of a model's misses where it answers anyway instead of saying it does not know) and, on pre-call planning, the time spent writing the answer on the long-document test (5 minutes; in practice it removes only the three settings with no figure). A setting that breaks a limit, or has no score for it, cannot be picked on that row. The guess limits sit at 45% on account research, 50% on pre-call planning, CRM updates and competitive intel, and 60% on RFPs and security questionnaires.",
  "Effectively tied: settings within 2 points of Peak are named in the row's note with their cost. The rubric still takes the top score, so a cheaper tied setting does not move into Peak; the note is there so you can choose it.",
  "No model repeats within a row. Balanced skips the Peak pick's model and Best Value skips both. Where no other model scores within the bar, the tier takes the best mix outside it and says so (no row needs that on this build), and where no third model passes a row's limits, Best Value stays empty (account research). Because the rule skips the cheaper settings of a model already in the row, a Best Value pick can cost more than Balanced and a Balanced pick more than Peak; where the rubric's own pick was one of those settings, the row's note names it with its cost. What the rubric cannot see (reading X, hearing a recording, a live voice drill, the research modes, whether an app offers a setting) goes in the row's notes, never into a tier; where the app does not show the rubric's setting, the dial names the nearest one the app offers and the why line says what that changes.",
  "Every row carries an evidence grade. A: the rubric's heaviest measures test the task's own output (a finished spreadsheet or deck). B: the rubric covers the models on independent proxies for the task. C: nothing in the rubric comes close to the task; the route rests on adjacent evidence.",
  "Flagged models are never routed: restricted-access, picker-only, unreleased or unscored models, and models with no seller-facing surface. A model shipped to developers but not yet to its maker's chat app (Grok 4.7 on this build) waits on the watch list until it lands there; the rubric keeps its scores in the data but does not rank it. Cards that no row picks stay on their provider page, marked Live, not routed, with the reason. Those that once had a card are listed under 'No longer on the router' below with their replacement; unreleased ones sit on the watch list.",
  "Everything is date-stamped. The ledger below lists the claims most likely to expire, with the date each should be re-verified. Rows on that ledger flag themselves as due when the date passes."
];

    { label: "Claude platform docs: Claude Sonnet 5.5 overview, what's new, prompting and migration", url: "https://platform.claude.com/docs/en/models/sonnet-5-5/overview", date: "read 2026-09-29 (again that evening)", note: "Released September 28; 1M window, 128K output (300K batch beta), June 2026 cutoff, text and images in, no fast mode; high effort by default for developers, with the levels recalibrated; a new setting turns off thinking before the answer but keeps it between tool calls, in place of turning thinking off; at higher effort or on an open-ended ask it can do more than asked, at low and medium it can stop to check in, and it sometimes answers from memory where a search would catch a change; Sonnet 5 prompts carry over; it declines in more categories than Sonnet 5; Sonnet 5 now listed as legacy." },
    { label: "Claude Sonnet 5.5 system card", url: "https://www.anthropic.com/claude-sonnet-5-5-system-card", date: "2026-09-28, read 2026-09-29", note: "Reliable knowledge cutoff June 2026; text output only." },
    { label: "Building with Claude Sonnet 5.5 (claude.dev)", url: "https://claude.dev/blog/building-with-claude-sonnet-5-5/", date: "2026-09-28, read 2026-09-29", note: "Medium by default in Claude Code; no fast mode; before reaching for xhigh or max, consider Opus 5.5; zero data retention for eligible customers." },
    { label: "Claude platform docs: context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows", date: "read 2026-09-29", note: "1M is the default wherever a model has it; Sonnet 5 tracks the room it has left, while Sonnet 5.5 and the newer Opus and Fable models do not." },
    { label: "Claude platform docs: data retention", url: "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention", date: "read 2026-09-29", note: "Zero data retention covers developer use of eligible models (the page excludes only the Fable and Mythos models, and the Sonnet 5.5 announcement confirms it for Sonnet 5.5); it does not cover the Claude app on any plan, the Team and Enterprise interfaces or Claude for Excel, and batch jobs are kept 29 days." },
    { label: "Claude platform docs: model deprecations", url: "https://platform.claude.com/docs/en/about-claude/model-deprecations", date: "read 2026-09-29", note: "Sonnet 5 is legacy, not deprecated: no retirement date, and not sooner than June 30, 2027 for developers." },
    { label: "Claude platform release notes", url: "https://platform.claude.com/docs/en/release-notes/overview", date: "read 2026-09-29", note: "Sonnet 5.5 (September 28); refusals that arrive before any output billed again in three categories from September 24." },
    { label: "Claude Opus 5.5 announcement", url: "https://www.anthropic.com/claude-opus-5-5", date: "2026-09-22", note: "Pricing and the 40% cost claim, output more than 30% faster, clearer writing, Fable-class safeguards, thinking always on; Sonnet 5.5 and Haiku 5.5 to follow." },
    { label: "Claude Opus product page", url: "https://www.anthropic.com/claude/opus", date: "read 2026-09-22", note: "Opus 5.5 on Pro, Max, Team and Enterprise; fast mode in Claude Code; stays in scope, follows writing rules, files ready to use." },
    { label: "Claude Opus 5 announcement", url: "https://www.anthropic.com/news/claude-opus-5", date: "2026-07-24", note: "Pricing, effort, default on Max; fast mode through usage credits in Claude Code." },
    { label: "Claude Sonnet 5 announcement (edited August 10)", url: "https://www.anthropic.com/news/claude-sonnet-5", date: "2026-06-30", note: "Launch price made permanent." },
    { label: "Claude platform docs: models overview, pricing, effort, context windows, deprecations", url: "https://platform.claude.com/docs/en/models/overview", date: "read 2026-09-15, 2026-09-23 and 2026-09-29", note: "Model ids, cutoffs, controls, prices; all current models take text and image in, text out; Sonnet 5 listed as legacy from September 28." },
    { label: "What a task costs on Opus 5.5", url: "https://claude.dev/blog/what-a-task-costs-on-opus-5-5/", date: "2026-09-25, read 2026-09-29", note: "Fable 5.1 at two and a half times the Opus 5.5 price; plan limits go about 25% further on Opus 5.5; start at medium, try high when medium stalls, keep xhigh and max for work where you have measured a gain." },
    { label: "Spending your effort (Claude Code blog)", url: "https://claude.dev/blog/spending-your-effort/", date: "2026-09-25, read 2026-09-29", note: "Low for quick work you review, medium for most, high where verification matters, max for hard work you leave it to finish." },
    { label: "Claude Code: fast mode", url: "https://code.claude.com/docs/en/fast-mode", date: "read 2026-09-23", note: "Opus 5.5 is the fast-mode default; on subscription plans fast mode bills to usage credits." },
    { label: "Claude Code: desktop scheduled tasks", url: "https://code.claude.com/docs/en/desktop-scheduled-tasks", date: "read 2026-09-23", note: "Runs skipped while the computer sleeps get one catch-up run on wake." },
    { label: "Claude pricing page", url: "https://claude.com/pricing", date: "read 2026-09-23 and 2026-09-29", note: "Fable on Pro through usage credits, on Max and Team premium seats up to half of weekly limits; Opus not on Free." },
    { label: "Salesforce in Claude (beta)", url: "https://claude.com/blog/salesforce-in-claude", date: "2026-09-15", note: "Reads and updates Salesforce with per-change approval; all paid plans, organizations Salesforce approves; help-center setup article 16952184." },
    { label: "Cowork is now Claude; Claude Docs and Claude Slides", url: "https://claude.com/blog/cowork-is-now-claude", date: "2026-09-16", note: "One conversation on Pro and Max, rolling out; Team and Enterprise unchanged for now; Docs, Slides and Design in beta on paid plans (help-center article 16761823)." },
    { label: "Claude platform docs: Claude Opus 5.5 overview", url: "https://platform.claude.com/docs/en/models/opus-5-5/overview", date: "read 2026-09-22 and 2026-09-29", note: "June 2026 cutoff, 1M window, 128K output (300K batch beta), medium default effort, moderate latency against Fable 5.1's slower, prices, active (latest)." },
    { label: "Claude platform docs: what's new in Claude Opus 5.5", url: "https://platform.claude.com/docs/en/models/opus-5-5/whats-new-opus-5-5", date: "read 2026-09-22 and 2026-09-29", note: "Thinking cannot be turned off, medium default, more thinking per level, sharper chart and screenshot reading, biology and reasoning-extraction safeguards." },
    { label: "Claude platform docs: prompting Claude Opus 5.5", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5", date: "read 2026-09-22 and 2026-09-29", note: "Start at medium and test other levels; keep xhigh and max for work with a measured gain; effort calibration, unattended runs, progress updates, look-around line for multi-app work, settled earlier answers, pasted text, visual inputs; Opus 5 prompts remain a starting point." },
    { label: "Claude platform docs: migrating to Claude Opus 5.5", url: "https://platform.claude.com/docs/en/models/opus-5-5/migration-guide", date: "read 2026-09-22 and 2026-09-29", note: "Same window and output as Opus 5; Opus 5-specific instructions may no longer be needed; re-run the effort sweep." },
    { label: "Claude platform docs: Claude Opus 5 overview", url: "https://platform.claude.com/docs/en/models/opus-5/overview", date: "read 2026-09-17 and 2026-09-22", note: "Cutoff, window, default effort, speed against Fable 5.1 and Sonnet 5, prices; marked active (legacy) on September 22." },
    { label: "Claude platform docs: what's new in Claude Opus 5", url: "https://platform.claude.com/docs/en/models/opus-5/whats-new-opus-5", date: "read 2026-09-17", note: "Effort pays off more reliably; longer replies and files; more narration and delegation; self-verification; fast mode." },
    { label: "Claude platform docs: prompting Claude Opus 5", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5", date: "read 2026-09-17", note: "Length, scope, progress updates, verification instructions, subagents, review prompts." },
    { label: "Claude platform docs: Claude Fable 5.1 overview", url: "https://platform.claude.com/docs/en/models/fable-5-1/overview", date: "read 2026-09-17 and 2026-09-29", note: "Cutoff, window, thinking always on, high effort by default for developers, slower than Opus 5, prices." },
    { label: "Claude platform docs: what's new in Claude Fable 5.1", url: "https://platform.claude.com/docs/en/models/fable-5-1/whats-new-fable-5-1", date: "read 2026-09-17 and 2026-09-29", note: "Gains over Fable 5 in long agentic sessions, knowledge work, research, vision, long context and computer use; behavior changes, refusals and fallback, pricing." },
    { label: "Claude platform docs: prompting Claude Fable 5.1", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5-1", date: "read 2026-09-17 and 2026-09-29", note: "Effort sweep from high, progress recaps, less searching at low effort, writing density, unmarked quotations, finishing the whole task." },
    { label: "Claude platform docs: migrating to Claude Fable 5.1", url: "https://platform.claude.com/docs/en/models/fable-5-1/migration-guide", date: "read 2026-09-17", note: "Refusal categories carried over; xhigh and max add time to the first response." },
    { label: "Claude platform docs: prompting Claude Fable 5", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5", date: "read 2026-09-17", note: "Origin of the progress-grounding line and the Skills guidance." },
    { label: "Claude platform docs: refusals and fallback", url: "https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback", date: "read 2026-09-17", note: "Refusal categories, including requests to reproduce reasoning in the reply." },
    { label: "Claude platform docs: prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", date: "read 2026-09-17", note: "Clear instructions, examples, roles, long documents, format, tool use, research." },
    { label: "Claude platform docs: tool use overview", url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", date: "read 2026-09-17", note: "When Claude calls a tool and how to steer it." },
    { label: "Claude platform docs: PDF support", url: "https://platform.claude.com/docs/en/build-with-claude/pdf-support", date: "read 2026-09-17", note: "Each page read as text plus an image; 1,500 to 3,000 text tokens a page; 600 pages per request." },
    { label: "Claude platform docs: thinking", url: "https://platform.claude.com/docs/en/build-with-claude/thinking", date: "read 2026-09-17 and 2026-09-29", note: "What thinking does, summaries not raw reasoning, cost, thinking between tool calls; adaptive thinking is the only mode on Opus 5.5, Fable 5.1, Sonnet 5.5 and Sonnet 5, and a fixed thinking budget is refused." },
    { label: "Claude platform docs: thinking troubleshooting and steering", url: "https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting", date: "read 2026-09-29", note: "Which model takes which thinking mode: Opus 5.5 and Fable 5.1 always on; Sonnet 5.5 on by default, with only the thinking before the answer switchable, and only for developers; Sonnet 5 on by default and can be turned off; effort is the primary lever on thinking, prompt wording a weaker one (steering page: thinking-steering-and-cost)." },
    { label: "Claude platform docs: extended thinking (manual budgets)", url: "https://platform.claude.com/docs/en/build-with-claude/extended-thinking", date: "read 2026-09-29", note: "The fixed-budget mode, deprecated on the 4.6 models and rejected on 4.7 and later." },
    { label: "Claude platform docs: thinking in tool and multi-turn workflows", url: "https://platform.claude.com/docs/en/build-with-claude/thinking-tool-workflows", date: "read 2026-09-17", note: "Thinking across a tool loop." },
    { label: "Claude platform docs: preserved thinking", url: "https://platform.claude.com/docs/en/build-with-claude/preserved-thinking", date: "read 2026-09-17", note: "Newer models read older models' reasoning, never the reverse, including after a fallback." },
    { label: "Claude platform docs: effort", url: "https://platform.claude.com/docs/en/build-with-claude/effort", date: "read 2026-09-17, 2026-09-22 and 2026-09-29", note: "Levels, what each is for, per-model recommendations, effort with tools and with thinking; Opus 5.5 defaults to medium for developers where the other models default to high." },
    { label: "Claude platform docs: web fetch tool", url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-fetch-tool", date: "read 2026-09-17 and 2026-09-29", note: "Claude fetches when you give it a link or point at a specific page; the page names no supported models, and filtered fetching works on Claude 4.6 and later." },
    { label: "Claude Code model configuration", url: "https://code.claude.com/docs/en/model-config", date: "read 2026-09-17, 2026-09-22 and 2026-09-29", note: "Opus 5.5 is the default on Pro, Max, Team and Enterprise since v2.1.280 (before it, Sonnet 5 on Pro); default effort medium on Opus 5.5 and Sonnet 5.5, high on every other model with effort except Opus 4.7; a level-by-job table." },
    { label: "Claude help center: change the model, effort and thinking settings", url: "https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings", date: "read 2026-09-17, 2026-09-22 and 2026-09-29 (updated 2026-09-28)", note: "The Effort menu sits under the model name and marks each model's default; changes apply from the next reply; higher effort reaches usage limits faster; thinking cannot be turned off for Sonnet 5.5, Opus 5.5, Fable 5.1 or Opus 5; the toggle may read Thinking or Extended." },
    { label: "Claude help center: how usage and length limits work", url: "https://support.claude.com/en/articles/11647753-understanding-usage-and-length-limits", date: "read 2026-09-29", note: "The effort level is one of the things that decide usage; lower it for routine tasks." },
    { label: "Claude help center: why Claude switched models with Opus 5 or Opus 5.5", url: "https://support.claude.com/en/articles/16049681-why-claude-switched-models-in-your-conversation-with-opus-5-or-opus-5-5", date: "read 2026-09-22", note: "Flagged cyber requests move to Opus 4.8, biology and frontier-model work to Opus 5, reasoning extraction is blocked outright; switching applies in Claude, Cowork, Claude Code, Claude Design, Claude for Microsoft 365 and Claude Tag." },
    { label: "Claude help center: context window on paid plans", url: "https://support.claude.com/en/articles/8606394-how-large-is-the-context-window-on-paid-claude-plans", date: "read 2026-09-22 and 2026-09-29 (updated 2026-09-28)", note: "Opus 5.5 and Sonnet 5.5 at 1M tokens in Claude, Claude Code and Cowork on paid plans; the Free plan's window is not stated." },
    { label: "Claude help center: why Claude switched models with Sonnet 5.5", url: "https://support.claude.com/en/articles/17161993-why-claude-switched-models-in-your-conversation-with-sonnet-5-5", date: "read 2026-09-29 (updated 2026-09-28)", note: "Flagged offensive-security and frontier-AI requests re-run on Sonnet 5 with a notice, and the picker stays on Sonnet 5 until you switch back; biology and reasoning-extraction requests are blocked; switching can be turned off in Settings, Capabilities; lists where Sonnet 5.5 runs, the Microsoft 365 add-ins included." },
    { label: "Claude help center: use voice mode", url: "https://support.claude.com/en/articles/11101966-use-voice-mode", date: "read 2026-09-22", note: "Voice mode runs the latest generation of the model family you last used in chat; Fable is not available in voice." },
    { label: "Claude help center: upload files to Claude", url: "https://support.claude.com/en/articles/8241126-upload-files-to-claude", date: "read 2026-09-17", note: "PDFs up to 1,000 pages in a chat; charts and images read in PDFs of 100 pages or fewer." },
    { label: "Claude in Chrome generally available", url: "https://claude.com/blog/claude-in-chrome-generally-available", date: "2026-08-26", note: "Autonomous actions, plans." },
    { label: "Claude for Excel docs", url: "https://claude.com/docs/office-agents/excel", date: "read 2026-09-23", note: "Capabilities and limits; generally available on Pro, Max, Team and Enterprise; #REF! and #DIV/0 tracing." },
    { label: "Claude Design help center (beta on paid plans)", url: "https://support.claude.com/en/articles/14604416-get-started-with-claude-design", date: "read 2026-09-23", note: "Plans, surfaces, exports (Google Slides only at claude.ai/design); launch post 2026-04-17." },
    { label: "Claude Tag (Claude in Slack) docs", url: "https://claude.com/docs/claude-tag/overview", date: "read 2026-09-23", note: "Team and Enterprise only, usage billing, connections, file limits." },
    { label: "Claude connectors: HubSpot, Zoom for Claude, Granola", url: "https://claude.com/connectors/hubspot", date: "read 2026-09-23", note: "HubSpot's connector (made by HubSpot) searches and updates contacts, companies, deals and tickets." }
  ]},
  { group: "OpenAI (first-party)", items: [
    { label: "GPT-6 Astra launch post", url: "https://openai.com/index/gpt-6-astra/", date: "2026-09-03", note: "Pricing, benchmarks, effort levels." },
    { label: "GPT-6 Astra system card", url: "https://deploymentsafety.openai.com/gpt-6-astra", date: "2026-09-03", note: "Monitorability, cyber gating." },
    { label: "GPT-5.6 launch post", url: "https://openai.com/index/gpt-5-6/", date: "2026-07-09", note: "Sol, Terra, Luna, Ultra, picker mapping." },
    { label: "Price-performance update (Terra and Luna cuts)", url: "https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6/", date: "2026-07-30", note: "" },
    { label: "Introducing GPT-6.1 Sol", url: "https://openai.com/index/introducing-gpt-6-1-sol/", date: "2026-09-29, read 2026-09-30", note: "An upgrade to GPT-6 Sol that nearly matches Astra on agentic coding, computer use and professional work at a fifth of Astra's token prices; in ChatGPT Work and Codex for Plus, Pro, Business, Enterprise and Edu, not yet in Chat; fewer factual errors than GPT-6 Sol at low effort on hard prompts; more transparent about its limitations; an Ultrafast version 'in the coming days'; developer prices $2 input, $0.10 cached, $10 output." },
    { label: "Model docs: gpt-6.1-sol", url: "https://developers.openai.com/api/docs/models/gpt-6.1-sol", date: "read 2026-09-29 and 2026-09-30", note: "Effort low to max, medium by default, no none or minimal; 1.05M window; 128K output; April 30, 2026 cutoff; text and image in; 'near-Astra performance at a lower cost'; cache reads at 5% of input; over 272K input the whole request bills at 2x input and 1.5x output." },
    { label: "GPT-6.1 Sol system card addendum", url: "https://deploymentsafety.openai.com/gpt-6-1-sol", date: "2026-09-29, read 2026-09-30", note: "The same safeguards stack as GPT-6 Astra; 'similarly low hallucination rates' to GPT-6 Sol on its set of flagged cases." },
    { label: "Using GPT-6 (developer guide; GPT-6 family prompting)", url: "https://developers.openai.com/api/docs/guides/latest-model", date: "read 2026-09-23 and 2026-09-30", note: "Prompting best practices for the GPT-6 family, based on Astra's behavior; GPT-6 Astra and GPT-6.1 Sol do not support the none effort, while GPT-6 Sol and Luna do; Ultra is a Work and Codex setting." },
    { label: "ChatGPT Work prompting guide", url: "https://learn.chatgpt.com/docs/prompting", date: "read 2026-09-30", note: "Describe the result, provide the sources, name the audience and how you will review it; 'Use only the supplied sources. Flag missing information instead of guessing.'" },
    { label: "ChatGPT Work and Codex speed settings", url: "https://learn.chatgpt.com/docs/agent-configuration/speed", date: "read 2026-09-30", note: "GPT-6.1 Sol runs Standard and Fast; GPT-6 Astra Ultrafast, up to 8x faster in Codex, on Pro $500 and eligible Enterprise and Edu plans, using the included allowance at 8x the standard rate." },
    { label: "ChatGPT Enterprise and Edu: models and limits", url: "https://help.openai.com/en/articles/11165333-chatgpt-enterprise-and-edu-models-limits", date: "read 2026-09-30", note: "GPT-6 Sol, GPT-6.1 Sol and GPT-6 Luna are Work and Codex models, off by default until an admin enables them." },
    { label: "DevDay 2026 recap", url: "https://openai.com/index/devday-2026-recap/", date: "2026-09-29, read 2026-09-30", note: "GPT-6.1 Sol, which it calls a major upgrade with exceptionally strong agentic coding; GPT-6 Astra Ultrafast in Work and Codex; GPT-6.1 Sol Ultrafast coming; the Pro 500 plan; Dots, always-on agents; plugin extensions; ChatGPT in Slack and Microsoft Teams." },
    { label: "GPT-6 Sol and GPT-6 Luna launch post", url: "https://openai.com/index/introducing-gpt-6-sol-and-luna/", date: "2026-09-22", note: "In Work and Codex for paid plans, Luna in the desktop app for Free and Go, not in Chat; half the GPT-5.6 promotional prices; reliability claims." },
    { label: "OpenAI pricing page", url: "https://developers.openai.com/api/docs/pricing", date: "read 2026-09-23, 2026-09-29 and 2026-09-30", note: "GPT-6.1 Sol at $2 / $10 with cached input at $0.10; GPT-6 Sol and Luna prices; Sol promotion 'at least through November 21'; long-context multipliers; the 5.6 rows now sit under 'All models'." },
    { label: "Model docs: gpt-6-astra, gpt-6-sol, gpt-6-luna, gpt-5.6-sol, terra, luna", url: "https://developers.openai.com/api/docs/models/gpt-6-sol", date: "read 2026-09-23 and 2026-09-29", note: "Cutoffs, context, controls; GPT-6 Astra takes low to max (no none, no ultra) and states no default." },
    { label: "OpenAI reasoning guide", url: "https://developers.openai.com/api/docs/guides/reasoning", date: "read 2026-09-29 and 2026-09-30", note: "What each effort level is for; GPT-5.6, GPT-6 Sol, GPT-6.1 Sol and Luna default to medium; Astra and GPT-6.1 Sol have no none; the models reason adaptively within the effort you set." },
    { label: "OpenAI developer reference: verbosity and reasoning effort", url: "https://developers.openai.com/api/reference/resources/responses/methods/create", date: "read 2026-09-29", note: "Verbosity (low, medium or high, default medium) sets answer length; reasoning effort sets how much the model thinks." },
    { label: "Controlling the length of OpenAI model responses", url: "https://help.openai.com/en/articles/5072518-controlling-the-length-of-openai-model-responses", date: "read 2026-09-29", note: "Verbosity and effort are developer controls, documented for GPT-5 models." },
    { label: "OpenAI model selection guide", url: "https://developers.openai.com/api/docs/guides/model-selection", date: "read 2026-09-29 and 2026-09-30", note: "OpenAI's model and effort pairings by kind of work; after DevDay, GPT-6.1 Sol at Medium for complex work you expect to revise and at Extra high for polished deliverables, and Astra at Low, Medium and Extra high, never High." },
    { label: "OpenAI developer changelog", url: "https://developers.openai.com/api/docs/changelog", date: "read 2026-09-29 and 2026-09-30", note: "September 25: an image-reading bug fixed in GPT-6 Sol and Luna; September 29: GPT-6.1 Sol and Ultrafast mode for GPT-6 Astra; nothing newer on September 30." },
    { label: "Work and Codex model guide (Power presets, GPT-5.5 retirement)", url: "https://developers.openai.com/codex/models", date: "read 2026-09-23, 2026-09-29 and 2026-09-30 (now served at learn.chatgpt.com/docs/models)", note: "Start GPT-6.1 Sol at your client's default, Luna at High, Astra at Light (the September 29 morning page said Sol at Medium); GPT-6.1 Sol runs Light to Ultra under Advanced; the two Sol presets among the six still run GPT-6 Sol (Sol Light 'selected in this example'), and some plans omit Astra Extra High; OpenAI's preview of Advanced gives Astra Light, Medium and Extra High; Luna reaches Max but not Ultra; GPT-5.5 leaves ChatGPT, Work and Codex October 14." },
    { label: "Work and Codex usage and pricing", url: "https://developers.openai.com/codex/pricing", date: "read 2026-09-23", note: "Shared allowance; GPT-6 message allowances; cloud chats on GPT-5.6 Sol." },

  /* ---------- model cards ---------- */
  function rungs(m) {
    var lv = m.dial.levels || "";

    var parts = lv.split("/").map(function (s) { return s.trim(); }).filter(Boolean);
    var d = (m.dial.deflt || "").toLowerCase();
    return '<div class="rungs">' + parts.map(function (p) {
      var key = p.split(" ")[0].toLowerCase();
      var re = new RegExp("(^|[^a-z])" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z]|$)");
      var isDef = key.length > 1 && re.test(d);
      return '<span class="rung' + (isDef ? " def" : "") + '">' + esc(p) + "</span>";
    }).join("") + "</div>" + (m.dial.deflt ? '<div class="lnote">Default: ' + esc(m.dial.deflt) + "</div>" : "");
  }
  function statusPill(m) {
    if (m.status === "live" && m.unrouted) return '<span class="pill status-unrouted">Live, not routed</span>';
    if (m.status === "live") return '<span class="pill status-live">Live</span>';
    return '<span class="pill status-' + m.status + '">' + esc(m.flagLabel || m.status) + "</span>";
  }
  function fold(label, items) {

  }
  function spec(k, v, cls, title) { return v ? '<span class="spec' + (cls ? " " + cls : "") + '"' + (title ? ' title="' + esc(title) + '"' : "") + '><span class="k">' + esc(k) + '</span><span class="v' + (cls ? " txt" : "") + '">' + esc(v) + "</span></span>" : ""; }
  /* Version 16: five price bands, set from the input price only (see the note at the top of data-models.js). */

  var EFFORT_KIND = { effort: "", thinking: " (thinking level)", mode: " (mode)" };
  /* The spec bar carries three items, in this order and nothing else: cutoff, the apps a seller opens it in, cost tier.

     and file output are drawn on the Sources page instead. */
  function specBar(m) {

      spec("Knows the world through", m.cutoff) +

  function modelCard(m, compact) {
